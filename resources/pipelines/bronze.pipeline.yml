resources:
  pipelines:
    obt_bronze:
      # Bronze layer — incremental ingestion of OBT Excel files from the UC Volume
      # into four raw streaming tables via Auto Loader + mapInPandas/openpyxl.
      name: claude_aidevkit_obt_bronze

      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      channel: CURRENT

      libraries:
        - file:
            path: ../../src/pipelines/obt_bronze/pipeline.py

      # openpyxl required for reading .xlsx files inside mapInPandas
      environment:
        dependencies:
          - openpyxl

      tags:
        project: claudexdatabricks
        layer: bronze
        managed_by: dab
